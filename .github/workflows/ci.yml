name: Quality Gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          pip install uv
          cd backend
          uv pip install --system --torch-backend cpu -e '.[dev,scrapling,local-embeddings]'
          python -c 'from scrapling.fetchers import FetcherSession'
      - name: Tests
        env:
          DATABASE_URL: sqlite:////tmp/estate-ci.db
        run: cd backend && pytest -q tests
      - name: Ruff
        run: cd backend && ruff check app tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install -g pnpm@9.15.4
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - run: cd frontend && pnpm lint
      - run: cd frontend && pnpm build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t estate-api:ci .
