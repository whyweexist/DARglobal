name: estate-intelligence-prod
x-api-image: &api-image
  build: {context: ., dockerfile: Dockerfile.api, args: {ENABLE_SCRAPLING: "${ENABLE_SCRAPLING:-false}"}}
  image: estate-intelligence-api:prod
x-api-env: &api-env
  env_file: [.env.production]
  environment:
    DATABASE_URL: sqlite:////data/estate.db
x-vol: &vol
  volumes:
    - /var/lib/estate-intelligence/data:/data
    - /var/lib/estate-intelligence/hf_cache:/home/estate/.cache/huggingface
services:
  init:
    <<: [*api-image,*api-env,*vol]
    command: ["sh","-c","alembic upgrade head && python -m app.cli bootstrap"]
    restart: "no"
  api:
    <<: [*api-image,*api-env,*vol]
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 7s
      retries: 5
  worker:
    <<: [*api-image,*api-env,*vol]
    command: ["python","-m","app.worker"]
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args: {API_URL_INTERNAL: http://api:8000}
    image: estate-intelligence-web:prod
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
  caddy:
    image: caddy:2.9-alpine
    environment: {APP_DOMAIN: "${APP_DOMAIN}"}
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  caddy_data: {}
  caddy_config: {}
